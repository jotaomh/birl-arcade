name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Build, lint e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências do Node
        run: npm ci

      - name: Instalar Python e dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0

      - name: Instalar linters
        run: |
          pip install ruff flake8 shellcheck

      - name: Compilar o BIRL (build)
        run: ./build

      - name: Verificar sintaxe do BIRL (transpila main.birl)
        run: npx birl main.birl >/dev/null

      - name: Checar estilo do Python (ruff)
        run: ruff check gui/ || true

      - name: Checar estilo do Python (flake8)
        run: flake8 gui/ || true

      - name: Shellcheck no run.sh e build
        run: |
          shellcheck run.sh
          shellcheck build

      - name: Testes de regressão
        run: npm test || ./run-tests.sh || true
